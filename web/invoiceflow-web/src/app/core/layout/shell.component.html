<a class="skip-link" href="#main">{{ 'app.skipToContent' | transloco }}</a>

<header class="topbar">
  <a class="brand" routerLink="/invoices" [attr.aria-label]="'app.name' | transloco">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <rect width="32" height="32" rx="7" fill="#2f80ed" />
      <path d="M9 7h10l5 5v13a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z" fill="#fff" />
      <path d="M19 7v5h5" fill="#c9defa" />
      <path d="M11.5 16h9M11.5 19.5h9M11.5 23h5" stroke="#2f80ed" stroke-width="1.6" stroke-linecap="round" />
    </svg>
    <span class="name">Invoice<strong>Flow</strong></span>
  </a>

  <nav class="nav" [attr.aria-label]="'app.nav.label' | transloco">
    <a
      routerLink="/invoices"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      {{ 'app.nav.invoices' | transloco }}
    </a>
    <a routerLink="/invoices/upload" routerLinkActive="active" ariaCurrentWhenActive="page">
      {{ 'app.nav.upload' | transloco }}
    </a>
  </nav>

  <div class="tools">
    @if (usesOidc()) {
      <if-auth-user />
    } @else if (developmentUsers()) {
      <if-dev-user-switcher />
    }
    <if-language-switcher />
  </div>
</header>

<main id="main" class="content" tabindex="-1">
  <ng-content />
</main>
