server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config and i18n must not be cached across deploys
    location ~* ^/(config\.json|i18n/) {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted assets may be cached; HTML stays revalidated
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
