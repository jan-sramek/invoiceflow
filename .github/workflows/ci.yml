name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1

  dotnet:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - run: dotnet restore InvoiceFlow.slnx
      - run: dotnet build InvoiceFlow.slnx --no-restore -c Release
      - run: dotnet test InvoiceFlow.slnx --no-build -c Release

      - name: Test with Czech culture
        run: dotnet test InvoiceFlow.slnx --no-build -c Release
        env:
          LANG: cs_CZ.UTF-8
          LC_ALL: cs_CZ.UTF-8

  angular:
    name: Angular
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/invoiceflow-web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/invoiceflow-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:check
      - name: OpenAPI types are current
        run: |
          npm run api:generate
          git diff --exit-code -- src/app/shared/api/schema.d.ts
      - run: npm run test:ci
      - run: npm run build

  images:
    name: Container image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: Api
            dockerfile: src/InvoiceFlow.Api/Dockerfile
            context: .
          - image: Worker
            dockerfile: src/InvoiceFlow.Worker/Dockerfile
            context: .
          - image: Migrator
            dockerfile: src/InvoiceFlow.Migrator/Dockerfile
            context: .
          - image: Keycloak
            dockerfile: deploy/images/keycloak/Dockerfile
            context: deploy/images/keycloak
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for amd64 and arm64
        run: >
          docker buildx build
          --platform linux/amd64,linux/arm64
          --file ${{ matrix.dockerfile }}
          --build-arg SOURCE_REVISION=${{ github.sha }}
          ${{ matrix.context }}
