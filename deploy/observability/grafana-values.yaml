ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - grafana.invoiceflow.localhost
  path: /

grafana.ini:
  server:
    root_url: http://grafana.invoiceflow.localhost:8080
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  news:
    news_feed_enabled: false
  # Grafana downloads several app plugins on startup by default; the core Explore view is enough
  plugins:
    preinstall_disabled: true

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.invoiceflow-observability.svc.cluster.local:3100
        isDefault: true
        jsonData:
          # Turns the trace id in .NET JSON logs into a link to the trace; $$ escapes Grafana's env interpolation
          derivedFields:
            - name: TraceId
              matcherRegex: '"TraceId":"([0-9a-f]{32})"'
              url: $${__value.raw}
              datasourceUid: tempo
              urlDisplayLabel: Open trace in Tempo
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.invoiceflow-observability.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
          lokiSearch:
            datasourceUid: loki
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server.invoiceflow-observability.svc.cluster.local:9090
        isDefault: false

# Dashboards and data sources are provisioned, so nothing needs to survive a restart
persistence:
  enabled: false

testFramework:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 384Mi
