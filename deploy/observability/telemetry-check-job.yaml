apiVersion: batch/v1
kind: Job
metadata:
  name: telemetry-check
  namespace: invoiceflow
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:v0.161.0@sha256:de5a352a31aaf103b70d6cca4001d0802e3fc2f902a9ea110ebe0bbe501000cb
          # Sends to the collector on the same node, the way the apps will
          args:
            - traces
            - --otlp-endpoint=$(NODE_IP):4317
            - --otlp-insecure
            - --service=telemetry-check
            - --traces=5
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
