mode: daemonset

image:
  repository: otel/opentelemetry-collector-k8s

presets:
  logsCollection:
    enabled: true
    includeCollectorLogs: false
    # Remembers file offsets on the node, so a collector restart doesn't resend old logs
    storeCheckpoints: true
  kubernetesAttributes:
    enabled: true

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  exporters:
    otlphttp/loki:
      endpoint: http://loki.invoiceflow-observability.svc.cluster.local:3100/otlp
    otlp/tempo:
      endpoint: tempo.invoiceflow-observability.svc.cluster.local:4317
      tls:
        insecure: true
    prometheusremotewrite:
      endpoint: http://prometheus-server.invoiceflow-observability.svc.cluster.local:9090/api/v1/write
      tls:
        insecure: true
    # Legacy mirror for dashboard.invoiceflow.localhost; Grafana uses Tempo + Prometheus.
    otlp/aspire:
      endpoint: aspire-dashboard.invoiceflow-observability.svc.cluster.local:18889
      tls:
        insecure: true
  service:
    pipelines:
      logs:
        exporters:
          - otlphttp/loki
      metrics:
        receivers:
          - otlp
        exporters:
          - prometheusremotewrite
          - otlp/aspire
      traces:
        receivers:
          - otlp
        exporters:
          - otlp/tempo
          - otlp/aspire

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

# Container log files on the nodes belong to root and are not world-readable
securityContext:
  runAsUser: 0
  runAsGroup: 0
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 200Mi
