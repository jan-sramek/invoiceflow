apiVersion: v1
kind: Namespace
metadata:
  name: invoiceflow-observability
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# The collector reads container logs from the nodes through hostPath,
# which only the privileged level allows
apiVersion: v1
kind: Namespace
metadata:
  name: invoiceflow-collector
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
