apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: invoiceflow
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: invoiceflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: invoiceflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # make app-up fills in the tag
          image: localhost:5001/invoiceflow-worker:${IMAGE_TAG}
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: invoiceflow-worker
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(NODE_IP):4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=invoiceflow,k8s.pod.name=$(POD_NAME)
            - name: CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-app
                  key: password
            - name: ConnectionStrings__Catalog
              value: Host=postgres.invoiceflow-infra.svc.cluster.local;Database=invoiceflow_catalog;Username=catalog_app;Password=$(CATALOG_PASSWORD);SSL Mode=Disable
            - name: DocumentStorage__ServiceUrl
              value: http://seaweedfs.invoiceflow-infra.svc.cluster.local:8333
            - name: DocumentStorage__AccessKey
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3
                  key: access-key
            - name: DocumentStorage__SecretKey
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3
                  key: secret-key
            # make app-up fills in the id; tenants come from access tokens in Stage 4
            - name: Tenancy__DevelopmentTenantId
              value: "${DEVELOPMENT_TENANT_ID}"
          # Only the health endpoints listen here; the worker has no Service
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tenant-databases
              mountPath: /var/run/secrets/invoiceflow/tenant-databases
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Mounted as files, so a new tenant is picked up without a restart
        - name: tenant-databases
          secret:
            secretName: invoiceflow-tenant-databases
            defaultMode: 0440
