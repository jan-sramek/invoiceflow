apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: invoiceflow
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: invoiceflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/part-of: invoiceflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # make app-up fills in the tag
          image: localhost:5001/invoiceflow-web:${IMAGE_TAG}
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # nginx-unprivileged needs writable temp, cache and log dirs on a read-only root
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: logs
              mountPath: /var/log/nginx
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: config
          configMap:
            name: web-config
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: invoiceflow
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: invoiceflow
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Same host as the API: / serves the SPA, /api stays on the API Ingress (longer prefix wins).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: invoiceflow
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: invoiceflow
spec:
  ingressClassName: traefik
  rules:
    - host: invoiceflow.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
