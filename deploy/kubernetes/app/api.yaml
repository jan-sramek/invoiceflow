apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: invoiceflow
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: invoiceflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: invoiceflow
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # make app-up fills in the tag
          image: localhost:5001/invoiceflow-api:${IMAGE_TAG}
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: invoiceflow-api
            # The collector DaemonSet listens on every node, so telemetry never leaves the node
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(NODE_IP):4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=invoiceflow,k8s.pod.name=$(POD_NAME)
            - name: CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-app
                  key: password
            - name: ConnectionStrings__Catalog
              value: Host=postgres.invoiceflow-infra.svc.cluster.local;Database=invoiceflow_catalog;Username=catalog_app;Password=$(CATALOG_PASSWORD);SSL Mode=Disable
            # make app-up fills in the id; tenants come from access tokens in Stage 4
            - name: Tenancy__DevelopmentTenantId
              value: "${DEVELOPMENT_TENANT_ID}"
            # X-Development-User personas until Keycloak sign-in in Stage 4
            - name: Authentication__DevelopmentUsers
              value: "true"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tenant-databases
              mountPath: /var/run/secrets/invoiceflow/tenant-databases
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Mounted as files, so a new tenant is picked up without a restart
        - name: tenant-databases
          secret:
            secretName: invoiceflow-tenant-databases
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: invoiceflow
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: invoiceflow
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Only /api is routed, so the health endpoints stay inside the cluster
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: invoiceflow
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: invoiceflow
spec:
  ingressClassName: traefik
  rules:
    - host: invoiceflow.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
