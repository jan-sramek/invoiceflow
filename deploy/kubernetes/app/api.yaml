apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: invoiceflow
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: invoiceflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: invoiceflow
    spec:
      automountServiceAccountToken: false
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # make app-up fills in the tag
          image: ${REGISTRY}/invoiceflow-api:${IMAGE_TAG}
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: invoiceflow-api
            # The collector DaemonSet listens on every node, so telemetry never leaves the node
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(NODE_IP):4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=invoiceflow,k8s.pod.name=$(POD_NAME)
            - name: CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-app
                  key: password
            # Trailing dot: absolute FQDN so Java does not append search domains (ndots).
            - name: ConnectionStrings__Catalog
              value: Host=postgres.invoiceflow-infra.svc.cluster.local.;Database=invoiceflow_catalog;Username=catalog_app;Password=$(CATALOG_PASSWORD);SSL Mode=Disable
            # Escape hatch for jobs without a user token; access tokens carry tenant_id
            - name: Tenancy__DevelopmentTenantId
              value: "${DEVELOPMENT_TENANT_ID}"
            - name: Authentication__DevelopmentUsers
              value: "false"
            - name: Authentication__Authority
              value: http://keycloak.invoiceflow-infra.svc.cluster.local.:8080/realms/invoiceflow
            - name: Authentication__ValidIssuer
              value: https://auth.invoiceflow.localhost:8080/realms/invoiceflow
            - name: Authentication__Audience
              value: invoiceflow-api
            - name: Authentication__RequireHttpsMetadata
              value: "false"
            - name: DocumentStorage__ServiceUrl
              value: http://seaweedfs.invoiceflow-infra.svc.cluster.local.:8333
            - name: DocumentStorage__Bucket
              value: invoiceflow-documents
            - name: DocumentStorage__AccessKey
              valueFrom:
                secretKeyRef:
                  name: document-storage
                  key: access-key
            - name: DocumentStorage__SecretKey
              valueFrom:
                secretKeyRef:
                  name: document-storage
                  key: secret-key
            - name: RabbitMq__Host
              value: rabbitmq.invoiceflow-infra.svc.cluster.local.
            - name: RabbitMq__VirtualHost
              value: invoiceflow
            - name: RabbitMq__UserName
              value: invoiceflow-api
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-api
                  key: password
            # Present after make onprem-spike / provision-tenant; optional so stack-up works without on-prem.
            - name: Tenancy__RootCertificatePath
              value: /var/run/secrets/invoiceflow/onprem-ca/ca.crt
            - name: Tenancy__ConnectTimeoutSeconds
              value: "2"
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tenant-databases
              mountPath: /var/run/secrets/invoiceflow/tenant-databases
              readOnly: true
            - name: onprem-ca
              mountPath: /var/run/secrets/invoiceflow/onprem-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Mounted as files, so a new tenant is picked up without a restart
        - name: tenant-databases
          secret:
            secretName: invoiceflow-tenant-databases
            defaultMode: 0440
        - name: onprem-ca
          configMap:
            name: onprem-postgres-ca
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: invoiceflow
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: invoiceflow
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Only /api is routed, so the health endpoints stay inside the cluster
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: invoiceflow
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: invoiceflow
spec:
  ingressClassName: traefik
  rules:
    - host: invoiceflow.localhost
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
