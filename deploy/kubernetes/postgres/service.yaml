apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: invoiceflow-infra
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Gives the StatefulSet pod a stable DNS name (postgres-0.postgres-headless)
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: invoiceflow-infra
  labels:
    app.kubernetes.io/name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
