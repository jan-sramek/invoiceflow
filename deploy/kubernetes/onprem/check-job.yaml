apiVersion: batch/v1
kind: Job
metadata:
  name: onprem-postgres-check
  namespace: invoiceflow
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: psql
          image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: onprem-postgres-superuser
                  key: password
            - name: PGSSLROOTCERT
              value: /certs/ca.crt
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              psql "host=onprem-postgres.invoiceflow.svc.cluster.local port=5432 user=postgres dbname=postgres sslmode=verify-full" \
                -v ON_ERROR_STOP=1 -c "SELECT 'onprem-pong' AS response;"
          volumeMounts:
            - name: ca
              mountPath: /certs
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
      volumes:
        - name: ca
          configMap:
            name: onprem-postgres-ca
