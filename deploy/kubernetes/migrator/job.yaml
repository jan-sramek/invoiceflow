# Run through make db-migrate, which replaces the previous Job and prints the log
apiVersion: batch/v1
kind: Job
metadata:
  name: migrator
  namespace: invoiceflow
  labels:
    app.kubernetes.io/name: migrator
    app.kubernetes.io/part-of: invoiceflow
spec:
  # Migrations are not retried blindly; a failure needs a look first
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrator
        app.kubernetes.io/part-of: invoiceflow
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          # make db-migrate fills in the tag
          image: localhost:5001/invoiceflow-migrator:${IMAGE_TAG}
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: invoiceflow-migrator
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://$(NODE_IP):4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name=invoiceflow,k8s.pod.name=$(POD_NAME)
            - name: CATALOG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-migrator
                  key: password
            # The catalog owner, so it can change the schema
            - name: ConnectionStrings__Catalog
              value: Host=postgres.invoiceflow-infra.svc.cluster.local;Database=invoiceflow_catalog;Username=catalog_migrator;Password=$(CATALOG_PASSWORD);SSL Mode=Disable
            - name: SchemaMigration__RootCertificatePath
              value: /var/run/secrets/invoiceflow/onprem-ca/ca.crt
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tenant-migrations
              mountPath: /var/run/secrets/invoiceflow/tenant-migrations
              readOnly: true
            - name: onprem-ca
              mountPath: /var/run/secrets/invoiceflow/onprem-ca
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Only this Job sees the logins that can change tenant schemas
        - name: tenant-migrations
          secret:
            secretName: invoiceflow-tenant-migrations
            defaultMode: 0440
        - name: onprem-ca
          configMap:
            name: onprem-postgres-ca
            optional: true
