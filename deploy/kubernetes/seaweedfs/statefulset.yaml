apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: invoiceflow-infra
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  serviceName: seaweedfs-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          # Master, volume server, filer and S3 gateway in one process. They find each other on
          # 127.0.0.1, so a new pod IP after a restart doesn't matter.
          args:
            - mini
            - -dir=/data
            - -ip=127.0.0.1
            - -bucket=invoiceflow-documents
            - -admin.ui=false
            - -s3.autoCreateBucket=false
            - -s3.allowDeleteBucketNotEmpty=false
          env:
            # Turned into the S3 admin identity on startup
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3
                  key: secret-key
          ports:
            - name: s3
              containerPort: 8333
          startupProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
