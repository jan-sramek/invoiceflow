apiVersion: v1
kind: Namespace
metadata:
  name: invoiceflow
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
# Safety net for containers that forget to set their own requests and limits
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: invoiceflow
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 256Mi
